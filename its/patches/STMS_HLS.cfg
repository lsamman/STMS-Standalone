// Thruster plumes and boiloff of the depot.
@PART[STMS_B3_Depot]:NEEDS[Waterfall]
{
	@EFFECTS
	{
		@running
		{
			!MODEL_MULTI_PARTICLE {}
		}
	}
}
@PART[STMS_B3_Depot]:NEEDS[Waterfall]
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = rcsFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			thrusterTransformName = RCSthruster
		}
		TEMPLATE
		{
			templateName = waterfall-rcs-jet-1
			overrideParentTransform = RCSthruster
			position = 0,0,0
			rotation = 0, 0, 180
			scale = 2.5, 2.5, 2.5
		}
	}
}
// The depot keeps its methane cold: a tenth of the boiloff of SEP's tanks, and the coolers start switched on.
@PART[STMS_B3_Depot]:NEEDS[CryoTanks]
{
	MODULE
	{
		name = ModuleCryoTank
		CoolingEnabled = True
		BOILOFFCONFIG
		{
			FuelName = LqdMethane
			BoiloffRate = 0.0005
			CoolingCost = 0.02
		}
	}
}
